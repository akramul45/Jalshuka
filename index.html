<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVDAS - সিকিউরড ডেটাবেস</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Excel Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECURITY LOGIN MODAL -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box guardian-border">
            <div class="modal-header">
                <h3>🔒 সিকিউরিটি অ্যাক্সেস</h3>
                <p id="loginSubtitle">ডেটাবেস আনলক করতে তথ্য দিন</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>ইউজারনেম</label>
                    <input type="text" id="username" placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="password" placeholder="Enter Code">
                </div>
                <button class="guardian-btn" onclick="performLogin()">ভেরিফাই করুন</button>
                <p id="loginError" class="error-msg">❌ তথ্য সঠিক নয়!</p>
            </div>
        </div>
    </div>

    <!-- NAVBAR (Always Visible) -->
    <header>
        <div class="container nav-content">
            <div class="logo-section">
                <span class="logo-icon">🛡️</span>
                <div>
                    <h1 id="pageTitle">VVDAS সিস্টেম</h1>
                    <small id="pageSubTitle">সিকিউরড ভিলেজ ডেটা গার্ডিয়ান</small>
                </div>
            </div>
            
            <div class="control-panel">
                <!-- Village Selector (Primary Trigger) -->
                <div class="select-wrapper">
                    <label>গ্রাম নির্বাচন করুন:</label>
                    <select id="villageSelect" onchange="handleVillageChange()">
                        <!-- JS will populate -->
                    </select>
                </div>

                <!-- Gender Toggle -->
                <div class="toggle-wrapper">
                    <button id="btnM" class="toggle-btn active" onclick="changeGender('M')">পুরুষ</button>
                    <button id="btnF" class="toggle-btn" onclick="changeGender('F')">নারী</button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        
        <!-- STATUS & UPLOAD SECTION -->
        <div id="statusSection" class="status-card" style="display:none;">
            <p id="statusMessage">🔄 ডেটা লোড হচ্ছে...</p>
            
            <!-- Manual Upload Fallback -->
            <div id="uploadContainer" class="upload-box" style="display:none;">
                <p class="warning-text">⚠️ সার্ভারে ফাইল পাওয়া যায়নি। দয়া করে লোকাল ফাইল আপলোড করুন:</p>
                <input type="file" id="fileInput" accept=".xlsx, .xls" onchange="handleFileUpload(this)">
                <label for="fileInput" class="custom-file-upload">📂 ফাইল সিলেক্ট করুন</label>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container guardian-glow">
            <div class="search-header">
                <span>🔍 ডেটা অনুসন্ধান</span>
                <div class="search-radios">
                    <label><input type="radio" name="searchType" value="sl"> ক্রমিক</label>
                    <label><input type="radio" name="searchType" value="name" checked> নাম</label>
                    <label><input type="radio" name="searchType" value="father"> পিতা/স্বামী</label>
                </div>
            </div>
            <div class="search-input-box">
                <input type="text" id="searchInput" placeholder="তথ্য লিখে খুঁজুন..." autocomplete="off">
                <div id="suggestionBox" class="suggestion-box"></div>
            </div>
        </div>

        <!-- DATA TABLE -->
        <div class="table-wrapper">
            <table id="voterTable">
                <thead>
                    <tr>
                        <th>ক্রমিক</th>
                        <th>নাম</th>
                        <th>পিতা/স্বামী</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- DETAILS POPUP -->
    <div id="detailsCard" class="details-card">
        <div class="details-header">
            <h3>ভোটার প্রোফাইল</h3>
            <button onclick="closeDetails()">✖</button>
        </div>
        <div id="detailsContent" class="details-body"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
